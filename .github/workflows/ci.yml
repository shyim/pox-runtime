name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate scripts
        run: |
          bash -n scripts/*.sh tests/*.sh
          python3 -m compileall -q scripts
          cc -std=gnu11 -D_GNU_SOURCE -Iinclude -fsyntax-only tests/smoke.c
