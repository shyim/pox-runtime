name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate scripts
        run: |
          bash -n scripts/*.sh tests/*.sh
          python3 -m compileall -q scripts
          cc -std=c11 -Iinclude -fsyntax-only tests/smoke.c
      - name: Verify response allocation bounds
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/response-buffer.c -o /tmp/pox-response-buffer-test
          /tmp/pox-response-buffer-test
